<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Выбор имени ребёнку</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; margin: 20px; }
  h1 { text-align: center; }
  .who { text-align: center; margin-bottom: 10px; }
  .who button { padding: 8px 16px; margin: 0 4px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; background: white; }
  .who button.active { background: #1976d2; color: white; border-color: #1976d2; }
  .board { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .column {
    background: white; border-radius: 12px; padding: 12px;
    width: 280px; min-height: 400px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .column h2 { text-align: center; margin-top: 0; }
  .col-yes h2 { color: #2e7d32; }
  .col-no h2 { color: #c62828; }
  .col-maybe h2 { color: #f9a825; }
  .item {
    background: #e3f2fd; padding: 10px 14px; margin: 8px 0;
    border-radius: 8px; cursor: grab; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  .item:active { cursor: grabbing; }
  .item .meta { font-size: 11px; color: #666; margin-left: 6px; }
  .item .del { color: #999; cursor: pointer; font-weight: bold; margin-left: 6px; }
  .item .del:hover { color: #c62828; }
  .add-form { display: flex; gap: 8px; margin: 20px auto; max-width: 500px; }
  .add-form input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  .add-form button { padding: 10px 20px; border-radius: 8px; border: none; background: #1976d2; color: white; cursor: pointer; }
  .drag-over { background: #fffde7; }
  .status { text-align: center; font-size: 12px; color: #888; margin-top: 10px; }
</style>
</head>
<body>
<h1>Выбор имени ребёнку</h1>

<div class="who">
  Кто вы?
  <button id="btn-mom">👩 Мама</button>
  <button id="btn-dad">👨 Папа</button>
</div>

<div class="add-form">
  <input id="newName" placeholder="Введите имя..." type="text" />
  <button id="btn-add">Добавить</button>
</div>

<div class="board">
  <div class="column col-yes" data-status="yes"><h2>✅ Да</h2></div>
  <div class="column col-maybe" data-status="maybe"><h2>🤔 Не знаю</h2></div>
  <div class="column col-no" data-status="no"><h2>❌ Нет</h2></div>
</div>

<div class="status" id="status">Подключение...</div>

<!-- Подключаем Firebase через обычный скрипт (без модулей, чтобы не было ошибок) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // Ваши ключи
  var firebaseConfig = {
    apiKey: "AIzaSyCGn-5wOuOPHVlFLpYUwszHgLIFFxN6w-s",
    authDomain: "baby-names-1ec1d.firebaseapp.com",
    databaseURL: "https://baby-names-1ec1d-default-rtdb.firebaseio.com",
    projectId: "baby-names-1ec1d",
    storageBucket: "baby-names-1ec1d.firebasestorage.app",
    messagingSenderId: "438452457347",
    appId: "1:438452457347:web:f5807d2b910e297483f0b6"
  };

  // Инициализация
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var namesRef = db.ref("names");

  var currentUser = localStorage.getItem("who") || null;
  var names = {};

  // Функция выбора пользователя
  document.getElementById('btn-mom').onclick = function() { setUser('Мама'); };
  document.getElementById('btn-dad').onclick = function() { setUser('Папа'); };

  function setUser(u) {
    currentUser = u;
    localStorage.setItem("who", u);
    document.getElementById('btn-mom').className = (u === 'Мама') ? 'active' : '';
    document.getElementById('btn-dad').className = (u === 'Папа') ? 'active' : '';
    render();
  }

  if (currentUser) setUser(currentUser);

  // Слушаем базу данных
  namesRef.on('value', function(snapshot) {
    names = snapshot.val() || {};
    document.getElementById('status').textContent = '🟢 Подключено — изменения видны обоим сразу';
    render();
  }, function(error) {
    document.getElementById('status').textContent = '🔴 Ошибка подключения к базе';
    console.error(error);
  });

  // Кнопка добавить
  document.getElementById('btn-add').onclick = function() {
    if (!currentUser) { alert('Сначала выберите, кто вы (Мама/Папа)'); return; }
    var input = document.getElementById('newName');
    var val = input.value.trim();
    if (!val) return;
    
    var exists = Object.values(names).some(function(n) { return n.text.toLowerCase() === val.toLowerCase(); });
    if (exists) { alert('Такое имя уже есть'); return; }
    
    var id = Date.now().toString();
    namesRef.child(id).set({ text: val, status: 'maybe', by: currentUser });
    input.value = '';
  };

  // Добавление по Enter
  document.getElementById('newName').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
  });

  // Отрисовка
  function render() {
    document.querySelectorAll('.column').forEach(function(col) {
      var status = col.dataset.status;
      col.querySelectorAll('.item').forEach(function(el) { el.remove(); });
      
      Object.keys(names).forEach(function(id) {
        var n = names[id];
        if (n.status === status) {
          var div = document.createElement('div');
          div.className = 'item';
          div.draggable = true;
          div.dataset.id = id;
          div.innerHTML = '<span>' + n.text + '<span class="meta">(' + (n.by || '—') + ')</span></span>' +
                          '<span class="del" title="Удалить">×</span>';
          
          div.querySelector('.del').onclick = function() { namesRef.child(id).remove(); };
          div.addEventListener('dragstart', function(e) { e.dataTransfer.setData('text/plain', id); });
          col.appendChild(div);
        }
      });
    });
  }

  // Drag and drop для колонок
  document.querySelectorAll('.column').forEach(function(col) {
    col.addEventListener('dragover', function(e) { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function() { col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e) {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (!currentUser) { alert('Сначала выберите, кто вы'); return; }
      var id = e.dataTransfer.getData('text/plain');
      if (id && names[id]) {
        namesRef.child(id).update({ status: col.dataset.status, by: currentUser });
      }
    });
  });
</script>
</body>
</html>
