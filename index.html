<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбор имени ребёнку</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; margin: 20px; -webkit-tap-highlight-color: transparent; }
  h1 { text-align: center; font-size: 24px; }
  .who { text-align: center; margin-bottom: 15px; }
  .who button { padding: 10px 16px; margin: 0 4px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; background: white; font-size: 16px; }
  .who button.active { background: #1976d2; color: white; border-color: #1976d2; }
  .board { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .column {
    background: white; border-radius: 12px; padding: 12px;
    width: 100%; max-width: 280px; min-height: 200px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .column h2 { text-align: center; margin-top: 0; font-size: 18px; }
  .col-yes h2 { color: #2e7d32; }
  .col-no h2 { color: #c62828; }
  .col-maybe h2 { color: #f9a825; }
  
  .item {
    background: #e3f2fd; padding: 12px 14px; margin: 8px 0;
    border-radius: 8px; cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; transition: background 0.2s;
  }
  .item:hover { background: #bbdefb; }
  .item .meta { font-size: 12px; color: #666; margin-left: 6px; }
  .item .del { color: #999; cursor: pointer; font-weight: bold; font-size: 20px; margin-left: 6px; padding: 0 5px; }
  .item .del:hover { color: #c62828; }
  
  .add-form { display: flex; gap: 8px; margin: 20px auto; max-width: 500px; padding: 0 10px; }
  .add-form input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
  .add-form button { padding: 12px 20px; border-radius: 8px; border: none; background: #1976d2; color: white; cursor: pointer; font-size: 16px; }
  .drag-over { background: #fffde7; }
  .status { text-align: center; font-size: 12px; color: #888; margin-top: 10px; }

  /* Стили для мобильного меню перемещения */
  .mobile-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;
  }
  .mobile-modal-content {
    background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 300px; text-align: center;
  }
  .mobile-modal h3 { margin-top: 0; }
  .mobile-modal button {
    display: block; width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none;
    font-size: 16px; cursor: pointer;
  }
  .btn-m-yes { background: #c8e6c9; color: #2e7d32; }
  .btn-m-maybe { background: #fff9c4; color: #f57f17; }
  .btn-m-no { background: #ffcdd2; color: #c62828; }
  .btn-m-cancel { background: #eee; color: #333; margin-top: 15px; }
</style>
</head>
<body>
<h1>Выбор имени ребёнку</h1>

<div class="who">
  Кто вы?
  <button id="btn-mom">👩 Мама</button>
  <button id="btn-dad">👨 Папа</button>
</div>

<div class="add-form">
  <input id="newName" placeholder="Введите имя..." type="text" />
  <button id="btn-add">Добавить</button>
</div>

<div class="board">
  <div class="column col-yes" data-status="yes"><h2>✅ Да</h2></div>
  <div class="column col-maybe" data-status="maybe"><h2>🤔 Не знаю</h2></div>
  <div class="column col-no" data-status="no"><h2>❌ Нет</h2></div>
</div>

<div class="status" id="status">Подключение...</div>

<!-- Всплывающее окно для мобильных -->
<div id="mobileModal" class="mobile-modal">
  <div class="mobile-modal-content">
    <h3 id="modalName">Переместить имя:</h3>
    <button class="btn-m-yes" onclick="moveTo('yes')">✅ В «Да»</button>
    <button class="btn-m-maybe" onclick="moveTo('maybe')">🤔 В «Не знаю»</button>
    <button class="btn-m-no" onclick="moveTo('no')">❌ В «Нет»</button>
    <button class="btn-m-cancel" onclick="closeModal()">Отмена</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyCGn-5wOuOPHVlFLpYUwszHgLIFFxN6w-s",
    authDomain: "baby-names-1ec1d.firebaseapp.com",
    databaseURL: "https://baby-names-1ec1d-default-rtdb.firebaseio.com",
    projectId: "baby-names-1ec1d",
    storageBucket: "baby-names-1ec1d.firebasestorage.app",
    messagingSenderId: "438452457347",
    appId: "1:438452457347:web:f5807d2b910e297483f0b6"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var namesRef = db.ref("names");

  var currentUser = localStorage.getItem("who") || null;
  var names = {};
  var selectedIdToMove = null;

  // Выбор пользователя
  document.getElementById('btn-mom').onclick = function() { setUser('Мама'); };
  document.getElementById('btn-dad').onclick = function() { setUser('Папа'); };

  function setUser(u) {
    currentUser = u;
    localStorage.setItem("who", u);
    document.getElementById('btn-mom').className = (u === 'Мама') ? 'active' : '';
    document.getElementById('btn-dad').className = (u === 'Папа') ? 'active' : '';
    render();
  }

  if (currentUser) setUser(currentUser);

  // Связь с базой
  namesRef.on('value', function(snapshot) {
    names = snapshot.val() || {};
    document.getElementById('status').textContent = '🟢 Подключено — изменения видны обоим сразу';
    render();
  }, function(error) {
    document.getElementById('status').textContent = '🔴 Ошибка подключения';
  });

  // Добавление
  document.getElementById('btn-add').onclick = function() {
    if (!currentUser) { alert('Сначала выберите, кто вы (Мама/Папа)'); return; }
    var input = document.getElementById('newName');
    var val = input.value.trim();
    if (!val) return;
    
    var exists = Object.values(names).some(function(n) { return n.text.toLowerCase() === val.toLowerCase(); });
    if (exists) { alert('Такое имя уже есть'); return; }
    
    var id = Date.now().toString();
    namesRef.child(id).set({ text: val, status: 'maybe', by: currentUser });
    input.value = '';
  };

  document.getElementById('newName').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
  });

  // Отрисовка
  function render() {
    document.querySelectorAll('.column').forEach(function(col) {
      var status = col.dataset.status;
      col.querySelectorAll('.item').forEach(function(el) { el.remove(); });
      
      Object.keys(names).forEach(function(id) {
        var n = names[id];
        if (n.status === status) {
          var div = document.createElement('div');
          div.className = 'item';
          div.draggable = true;
          div.dataset.id = id;
          div.innerHTML = '<span>' + n.text + '<span class="meta">(' + (n.by || '—') + ')</span></span>' +
                          '<span class="del" title="Удалить">×</span>';
          
          // Удаление
          div.querySelector('.del').onclick = function(e) { 
            e.stopPropagation(); // Чтобы не открывалось меню при удалении
            namesRef.child(id).remove(); 
          };
          
          // Перетаскивание мышкой (для ПК)
          div.addEventListener('dragstart', function(e) { e.dataTransfer.setData('text/plain', id); });
          
          // КЛИК или ТАП (для телефонов) - открывает меню перемещения
          div.addEventListener('click', function() {
            selectedIdToMove = id;
            document.getElementById('modalName').textContent = n.text;
            document.getElementById('mobileModal').style.display = 'flex';
          });

          col.appendChild(div);
        }
      });
    });
  }

  // Меню для телефона
  function moveTo(newStatus) {
    if (!currentUser) { alert('Сначала выберите, кто вы'); closeModal(); return; }
    if (selectedIdToMove) {
      namesRef.child(selectedIdToMove).update({ status: newStatus, by: currentUser });
    }
    closeModal();
  }

  function closeModal() {
    document.getElementById('mobileModal').style.display = 'none';
    selectedIdToMove = null;
  }

  // Перетаскивание для ПК (Drop)
  document.querySelectorAll('.column').forEach(function(col) {
    col.addEventListener('dragover', function(e) { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function() { col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e) {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (!currentUser) { alert('Сначала выберите, кто вы'); return; }
      var id = e.dataTransfer.getData('text/plain');
      if (id && names[id]) {
        namesRef.child(id).update({ status: col.dataset.status, by: currentUser });
      }
    });
  });
</script>
</body>
</html>
